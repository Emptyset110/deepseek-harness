[project]
name = "pydsh"
version = "0.0.0"
description = "Pure-Python rewrite of deepseek-harness (MIT). Includes cordis, a port of the Cordis framework kernel (upstream cordiverse/cordis @ 56b3d4f + dsh local modifications)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.scripts]
pydsh = "pydsh.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycordis", "src/pydsh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
mypy_path = "src"
python_version = "3.11"
strict = true
disallow_any_expr = false
